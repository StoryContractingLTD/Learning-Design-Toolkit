<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0">
<title>Learning Design Toolkit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,800&display=swap">
<style>
/* Layout: Story Blue brand bar, project strip, stage rail on the left and a working canvas on the right; on phones the rail becomes a horizontal strip */
:root{
  --blue:#0061ad;          /* Story Blue: brand bar, always */
  --accent:#0061ad;        /* interactive accent */
  --accent-soft:#e3eef8;
  --teal:#01a4ab; --teal-soft:#dff3f4;
  --amber:#b87d00; --amber-soft:#fcf1d8;
  --green:#4f8a1c; --green-soft:#eaf3df;
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eceff2;
  --fg:#2d3238; --muted:#60666d; --line:#d6dadf; --filler:#dee0e1;
  --b1:#9fd6d8; --b2:#5fbfc3; --b3:#01a4ab; --b4:#2f86c9; --b5:#0061ad; --b6:#22357a;
  --font-head:"Montserrat", Arial, "Helvetica Neue", sans-serif;
  --font-body:Arial, "Helvetica Neue", Helvetica, sans-serif;
  --r:8px; --danger:#b3261e;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --accent:#6fb3ea; --accent-soft:#1a2d40;
  --teal:#45c9ce; --teal-soft:#14302f;
  --amber:#f0b84a; --amber-soft:#33280f;
  --green:#97cc62; --green-soft:#1f2c14;
  --bg:#10161d; --surface:#18212b; --sunk:#131b23;
  --fg:#e4e8ec; --muted:#a3acb5; --line:#2c3a48; --filler:#26323e; --danger:#ff8a80;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --accent:#6fb3ea; --accent-soft:#1a2d40;
  --teal:#45c9ce; --teal-soft:#14302f;
  --amber:#f0b84a; --amber-soft:#33280f;
  --green:#97cc62; --green-soft:#1f2c14;
  --bg:#10161d; --surface:#18212b; --sunk:#131b23;
  --fg:#e4e8ec; --muted:#a3acb5; --line:#2c3a48; --filler:#26323e; --danger:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand bar */
.brand{background:var(--blue);color:#fff}
.brand .in{display:flex;align-items:center;gap:16px;padding-block:12px;max-width:1280px;margin:0 auto}
.logo{display:block;height:34px;width:auto;max-width:none}
.brand .t{font-family:var(--font-head);font-weight:600;font-size:15px;border-left:1px solid rgba(255,255,255,.4);padding-left:16px}
.brand .strap{margin-left:auto;font-size:12px;opacity:.9;letter-spacing:.04em;text-transform:uppercase}

/* project strip */
.pstrip{background:var(--surface);border-bottom:1px solid var(--line)}
.pstrip .in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;max-width:1280px;margin:0 auto}
.pstrip label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pstrip select{min-width:0;max-width:260px}
#pName{flex:1 1 220px;min-width:0;font-family:var(--font-head);font-weight:600;font-size:16px;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:6px}
#pName:hover{border-color:var(--line)}
#pName:focus{border-color:var(--accent);background:var(--surface)}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.status.warn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:6px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:#b3261e;color:#fff;border-color:#b3261e}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.banner{max-width:1280px;margin:12px auto 0;background:var(--amber-soft);border:1px solid var(--amber);color:var(--fg);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.banner b{font-family:var(--font-head);font-weight:600}

/* shell */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;padding-block:20px 48px}
nav.rail{position:sticky;top:12px;align-self:start}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer}
.rail button:hover{background:var(--sunk)}
.rail button[aria-current="step"]{background:var(--accent-soft)}
.rail button[aria-current="step"] .nm{color:var(--accent);font-weight:bold}
.rail .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-family:var(--font-head);font-weight:600;border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.rail .done .no{background:var(--green);border-color:var(--green);color:#fff}
.rail .nm{font-size:14px}
.rail .pc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.overall{margin:14px 10px 0;font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--filler);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--teal);transition:width .3s}

main{min-width:0}
.stage-head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:bold}
.stage-head h2{font-size:26px}
.stage-head p{margin:0;color:var(--muted);max-width:68ch}

details.guide{background:var(--teal-soft);border-radius:var(--r);padding:0;margin-bottom:20px;border:1px solid color-mix(in srgb,var(--teal) 35%,transparent)}
details.guide summary{cursor:pointer;padding:12px 16px;font-family:var(--font-head);font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;line-height:1}
details.guide[open] summary::before{content:"–"}
.guide .gb{padding:0 16px 14px 44px;max-width:80ch}
.guide .gb p{margin:.4em 0}
.guide .gb ul{margin:.4em 0;padding-left:1.2em}
.guide .gb li{margin:.2em 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px;margin-bottom:18px}
.panel > h3{font-size:17px}
.panel > .sub{margin:-12px 0 0;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lbl{font-weight:bold;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:-2px 0 2px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0b1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0b1520}}

.checks{display:flex;flex-direction:column;gap:2px}
.checks h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
.checks h4:first-child{margin-top:0}
.ck{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:7px 8px;border-radius:6px;cursor:pointer}
.ck:hover{background:var(--sunk)}
.ck input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--teal)}
.ck small{display:block;color:var(--muted);font-size:12.5px}
.ck .ref{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.ck.on > span{color:var(--muted)}

.readout{border-radius:var(--r);padding:12px 14px;font-size:14px;border:1px solid var(--line);background:var(--sunk)}
.readout.good{background:var(--green-soft);border-color:var(--green)}
.readout.warn{background:var(--amber-soft);border-color:var(--amber)}
.readout b{font-family:var(--font-head);font-weight:600}

/* Bloom */
.stair{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.step{border:0;cursor:pointer;border-radius:6px 6px 0 0;padding:10px 6px;text-align:center;font-family:var(--font-head);font-weight:600;font-size:13px;color:#fff;position:relative}
.step small{display:block;font-family:var(--font-body);font-weight:normal;font-size:11px;opacity:.9}
.step[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.step.l1{background:var(--b1);color:#0d3436;height:60px}.step.l2{background:var(--b2);color:#0d3436;height:74px}.step.l3{background:var(--b3);color:#06292b;height:88px}
.step.l4{background:var(--b4);height:102px}.step.l5{background:var(--b5);height:116px}.step.l6{background:var(--b6);height:130px}
.lvl-info{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.verbs{display:flex;flex-wrap:wrap;gap:6px}
.composer{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.preview{font-size:15px;padding:12px 14px;border-radius:6px;background:var(--sunk);border:1px dashed var(--line)}
.preview em{color:var(--muted)}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.oitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:bold;white-space:nowrap;padding:3px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.badge i{width:10px;height:10px;border-radius:2px;display:inline-block}
.flag{font-size:12px;color:var(--amber);font-weight:bold}
.dist{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--filler)}
.dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-head);font-weight:600;font-size:13px;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td textarea{min-height:64px;font-size:14px}
td select{font-size:14px}
.lvlcell{font-family:var(--font-head);font-weight:600}
.lvlcell small{display:block;font-family:var(--font-body);font-weight:normal;color:var(--muted);font-size:12px}

/* storyboard */
.sb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:scr}
.scr{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.scr-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scr-h .n{font-family:var(--font-head);font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scr-h input{flex:1 1 200px}
.scr-h .tools{display:flex;gap:6px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* brief */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:860px}
.brief h3{font-size:20px;color:var(--accent);margin:0 0 4px}
.brief h4{font-size:15px;margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--filler)}
.brief p{margin:.3em 0}
.brief dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:4px 14px;margin:0}
.brief dt{color:var(--muted);font-size:13px}
.brief dd{margin:0}
.brief ul{margin:.3em 0;padding-left:1.2em}
.brief .gap{color:var(--muted);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-top:8px}
  nav.rail{position:static;overflow-x:auto;margin-inline:-16px;padding-inline:16px}
  .rail ol{flex-direction:row;gap:4px;width:max-content}
  .rail button{grid-template-columns:24px auto;padding:6px 10px}
  .rail .pc{display:none}
  .overall{display:none}
  .grid2,.lvl-info,.composer{grid-template-columns:minmax(0,1fr)}
  .brand .strap{display:none}
  .stair .step small{display:none}
  .brief dl{grid-template-columns:minmax(0,1fr)}
  .brief dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- Bloom's (revised, Anderson & Krathwohl 2001) ---------- */
const BLOOM = [
 {n:1,name:"Remember",desc:"Recall facts, terms and basic procedures.",verbs:["list","name","identify","recall","state","define","label","recognise","match"],
  assess:["Multiple-choice question","Matching / drag-and-drop","Label a diagram","Quick-fire quiz (e.g. Kahoot)"],
  act:["Flashcards or knowledge check","Spot the sign / symbol","Short recap quiz"]},
 {n:2,name:"Understand",desc:"Explain ideas in their own words and give examples.",verbs:["explain","describe","summarise","classify","compare","interpret","give examples of","paraphrase"],
  assess:["Explain in own words (short answer)","Sort / classify examples","MCQ with reasoning","Teach-back to a supervisor"],
  act:["Sorting activity","Worked example with commentary","Discussion prompt"]},
 {n:3,name:"Apply",desc:"Use a procedure or rule in a real work situation.",verbs:["apply","carry out","demonstrate","use","complete","calculate","select","follow","implement"],
  assess:["Scenario-based question","Practical observation on site","Software simulation","Workplace task sign-off"],
  act:["Guided practice","Simulation / try-it","Job aid used on a real task"]},
 {n:4,name:"Analyse",desc:"Break a situation down, spot causes and patterns.",verbs:["analyse","differentiate","investigate","spot","examine","break down","prioritise","diagnose"],
  assess:["Spot-the-hazard image or video","Case study diagnosis","Root-cause exercise","Compare two methods"],
  act:["Hotspot image exploration","Incident case review","5 Whys exercise"]},
 {n:5,name:"Evaluate",desc:"Make and justify a judgement or decision.",verbs:["evaluate","assess","judge","justify","recommend","decide","critique","defend"],
  assess:["Branching scenario with consequences","Critique a RAMS or document","Justify a decision with rationale","Peer review"],
  act:["Branching scenario","Debate or decision game","Review a real example"]},
 {n:6,name:"Create",desc:"Produce something new: a plan, product or solution.",verbs:["design","plan","produce","develop","construct","write","propose","build"],
  assess:["Produce a plan or briefing","Project / portfolio piece","Deliver a toolbox talk","Design a solution to a brief"],
  act:["Project work","Plan-and-present task","Coaching conversation"]}
];
const VAGUE = /\b(understand|know|be aware|aware of|appreciate|learn about|be familiar|familiarise|realise|grasp)\b/i;

/* ---------- Stage definitions ---------- */
const DELIVERY = ["Actus eLearning (Rise)","Actus eLearning (Storyline)","Classroom workshop","Toolbox talk","Virtual session (Teams)","Blended","Video","Job aid / quick reference","Coaching / on the job"];
const STAGES = [
 {id:"setup",name:"Project setup",intro:"Agree the request, people and constraints before anything is designed.",
  guide:`<p>Capture the request as it was given, then pin down who owns it and what's fixed.</p><ul><li>Who asked for this, and who will sign it off?</li><li>What's driving it now: an incident, an audit, a new process, a client requirement?</li><li>What's fixed: deadline, budget, delivery channel, mandatory content?</li><li>Write a one-line problem statement you'd be happy to read back to the sponsor.</li></ul>`,
  blocks:[{panel:"The request",items:[
    {t:"row",items:[{t:"text",k:"requester",label:"Requested by"},{t:"text",k:"sponsor",label:"Sponsor / sign-off"}]},
    {t:"row",items:[{t:"text",k:"sme",label:"Subject matter expert(s)"},{t:"date",k:"deadline",label:"Target launch date"}]},
    {t:"textarea",k:"problem",label:"Problem statement",hint:"One or two sentences. What's going wrong, for whom, and why it matters to Story."},
    {t:"textarea",k:"context",label:"Why now?",hint:"Trigger for the request, e.g. incident trend, audit finding, new legislation."}
  ]},{panel:"Shape of the solution",items:[
    {t:"chips",k:"delivery",label:"Likely delivery",hint:"Pick any that apply. You can change this after the needs analysis.",opts:DELIVERY},
    {t:"row",items:[{t:"text",k:"duration",label:"Learner time budget",hint:"e.g. 20 minutes, half-day"},{t:"select",k:"mandatory",label:"Status",opts:["","Mandatory / compliance","Role-required","Recommended","Voluntary (library)"]}]},
    {t:"textarea",k:"constraints",label:"Constraints and dependencies",hint:"Budget, SME availability, LMS limits, site access, union or client approval."}
  ]}]},
 {id:"needs",name:"Needs analysis",intro:"Check the gap is real and that learning is the right fix before building anything.",
  guide:`<p>Start with the business result, then work back to what people need to do differently.</p><ul><li><b>Goal:</b> what measurable result should improve? (incidents, rework, audit scores, time)</li><li><b>Gap:</b> what do people do now, and what should they do instead?</li><li><b>Cause:</b> if their job depended on it, could they do it right now? If yes, the problem probably isn't knowledge or skill.</li><li><b>Evidence:</b> look at incident data, audits, observations and conversations with the people doing the job.</li></ul><p>Training fixes knowledge and skill gaps. Tools, process, workload and motivation gaps usually need a different fix, or training plus something else.</p>`,
  blocks:[{panel:"Performance gap",items:[
    {t:"textarea",k:"goal",label:"Business goal",hint:"The measurable result this should move, e.g. reduce manual handling RIDDORs by 25% in 12 months."},
    {t:"row",items:[{t:"textarea",k:"current",label:"What people do now"},{t:"textarea",k:"desired",label:"What they should do instead"}]},
    {t:"textarea",k:"evidence",label:"Evidence of the gap",hint:"Data sources and what they show."}
  ]},{panel:"Root cause",sub:"What's stopping people performing? Choose every cause the evidence supports.",items:[
    {t:"chips",k:"causes",label:"Causes",opts:["Knowledge","Skill / practice","Motivation / attitude","Tools or equipment","Process or procedure","Time / workload","Information / communication","Environment / site conditions"]},
    {t:"custom",render:"causeReadout"},
    {t:"textarea",k:"nontraining",label:"Non-training actions",hint:"Fixes for causes training won't solve, and who owns them."}
  ]},{panel:"Evidence gathered",items:[
    {t:"checks",k:"na",items:[["Spoke to the sponsor about the business goal"],["Interviewed SMEs"],["Spoke to people who do the job"],["Observed the task on site or in the office"],["Reviewed incident, audit or performance data"],["Checked for existing learning on Actus"]]}
  ]}]},
 {id:"learners",name:"Learner profile",intro:"Who the learners are and where they'll be when they learn.",
  guide:`<p>Design for the real person on the real device. Site-based colleagues often learn on their own phone, in short gaps, in noisy places.</p><ul><li>Assume variable literacy and digital confidence unless you know otherwise.</li><li>Ask about shift patterns, connectivity and whether learning time is paid and protected.</li><li>Note anything that changes access: hearing, sight, dyslexia, ADHD, English as an additional language.</li><li>Speak to two or three real learners. A quick chat beats any assumption.</li></ul>`,
  blocks:[{panel:"Who they are",items:[
    {t:"row",items:[{t:"text",k:"roles",label:"Roles / job titles"},{t:"text",k:"headcount",label:"Approximate number"}]},
    {t:"row",items:[{t:"select",k:"workpattern",label:"Work pattern",opts:["","Site-based","Office-based","Mixed site and office","Field / mobile","Depot / yard"]},{t:"select",k:"digital",label:"Digital confidence",opts:["","Low","Mixed","Good","High"]}]},
    {t:"chips",k:"devices",label:"Devices they'll use",opts:["Own phone (BYOD)","Company phone","Company laptop","Tablet","Shared PC / kiosk","No device: face to face only"]},
    {t:"textarea",k:"prior",label:"What they already know",hint:"Prior training, experience, cards held (e.g. CSCS, PTS)."}
  ]},{panel:"Barriers and inclusion",items:[
    {t:"textarea",k:"motivation",label:"What's in it for them? Likely barriers?",hint:"Motivators, frustrations, previous experience of training."},
    {t:"textarea",k:"inclusion",label:"Access and inclusion considerations",hint:"Literacy, language, neurodiversity, sensory needs, connectivity, noise."},
    {t:"textarea",k:"persona",label:"Persona snapshot",hint:"Two or three lines describing a typical learner in their own words."}
  ]}]},
 {id:"outcomes",name:"Learning outcomes",intro:"Write measurable outcomes using Bloom's taxonomy, pitched at the level the job needs.",
  guide:`<p>A good outcome says what the learner will be able to <b>do</b>, in terms you could observe or assess.</p><ul><li>Use one action verb per outcome. Avoid "understand", "know" and "be aware of": you can't see them.</li><li>Pitch the level at the job. Most workplace learning should reach <b>Apply</b> or higher.</li><li>Add a condition or standard where it helps: "using the site lift plan", "without prompts".</li><li>Aim for 3 to 5 outcomes per module. More usually means the module is too big.</li></ul><p>Pattern: <i>By the end, learners will be able to</i> + verb + what + condition/standard.</p>`,
  custom:"bloom"},
 {id:"assessment",name:"Assessment",intro:"Match every outcome to an assessment at the same Bloom's level.",
  guide:`<p>Constructive alignment: the outcome, the practice activity and the assessment should all sit at the same level.</p><ul><li>An "Apply" outcome needs an applied assessment, such as a scenario or observation, not a recall quiz.</li><li>Use formative checks during the learning and a summative check at the end.</li><li>Write plausible distractors based on real mistakes people make on site.</li><li>Avoid trick questions, double negatives and "all of the above".</li></ul>`,
  custom:"assess",
  blocks:[{panel:"Assessment rules",items:[
    {t:"row",items:[{t:"text",k:"passmark",label:"Pass mark",hint:"e.g. 80%"},{t:"text",k:"attempts",label:"Attempts allowed",hint:"e.g. Unlimited, with feedback"}]},
    {t:"textarea",k:"formative",label:"Formative checks",hint:"Low-stakes practice during the learning."},
    {t:"textarea",k:"summative",label:"Summative assessment",hint:"What proves competence, and who records it."},
    {t:"checks",k:"as",items:[["Every outcome has an assessment"],["Assessment level matches outcome level"],["Questions test application, not just recall"],["Distractors are plausible, based on real errors"],["No trick questions or double negatives"],["Question bank big enough for retakes"]]}
  ]}]},
 {id:"design",name:"Design & storyboard",intro:"Choose the format, chunk the content and plan each screen or section.",
  guide:`<p>Start from the practice activities, then add only the content people need to do them well.</p><ul><li>Keep chunks short: 5 to 10 minutes each works well on a phone.</li><li>Open with a realistic Story scenario or problem, not a list of objectives.</li><li>Put practice before the final assessment.</li><li>Every screen should link to an outcome. If it doesn't, question whether it's needed.</li><li>Plan alt text and captions now, not at build.</li></ul>`,
  custom:"storyboard",
  blocks:[{panel:"Design approach",items:[
    {t:"chips",k:"modality",label:"Final format",opts:DELIVERY},
    {t:"chips",k:"interactions",label:"Main interaction types",opts:["Scenario / branching","Knowledge check","Drag and drop","Hotspot / spot the hazard","Tabs / accordion","Video","Click to reveal","Simulation","Reflection prompt","Downloadable job aid"]},

/* ---------- Progress ---------- */
function stageKeys(st){
  const f=[], c=[];
  const walk = items => items.forEach(it => {
    if (it.t==="row") walk(it.items);
    else if (it.t==="checks"){
      if (it.groups) it.groups.forEach((g,gi)=>g[1].forEach((_,i)=>c.push(`${it.k}.${gi}.${i}`)));
      else it.items.forEach((_,i)=>c.push(`${it.k}.${i}`));
    } else if (it.k && !String(it.k).startsWith("fbpartial") && it.k!=="fbend") f.push(it.k);
  });
  (st.blocks||[]).forEach(b=>walk(b.items));
  return {f,c};
}
function progress(st){
  if (st.id==="brief") return null;
  const {f,c} = stageKeys(st);
  let tot = f.length + c.length, got = 0;
  f.forEach(k => { const v = cur.fields[k]; if (Array.isArray(v) ? v.length : String(v??"").trim()) got++; });
  c.forEach(k => { if (cur.checks[k]) got++; });
  if (st.custom==="bloom"){ tot += 3; got += Math.min(3, cur.objectives.length); }
  if (st.custom==="assess"){ tot += cur.objectives.length; got += cur.objectives.filter(o=>o.method).length; }
  if (st.custom==="storyboard"){ tot += 2; got += Math.min(2, cur.screens.length); }
  if (st.custom==="kirk"){ for (let l=1;l<=4;l++) ["measure","method","timing","owner"].forEach(p=>{ tot++; if (String(cur.fields[`ev_${l}_${p}`]??"").trim()) got++; }); }
  return tot ? Math.round(got/tot*100) : 0;
}
function renderRail(){
  let sum=0,n=0;
  $("#rail").innerHTML = STAGES.map((st,i) => {
    const p = progress(st);
    if (p!==null){ sum+=p; n++; }
    const done = p===100;
    return `<li class="${done?"done":""}"><button type="button" data-goto="${st.id}" ${st.id===stageId?'aria-current="step"':""}>
      <span class="no" aria-hidden="true">${done?"✓":i+1}</span><span class="nm">${esc(st.name)}</span><span class="pc">${p===null?"":p+"%"}</span></button></li>`;
  }).join("");
  const o = n ? Math.round(sum/n) : 0;
  $("#overallTxt").textContent = `${o}% of the design complete`;
  $("#overallBar").style.width = o+"%";
}

/* ---------- Field rendering ---------- */
function fieldHTML(it){
  const id = "f-"+it.k;
  const lab = it.label ? `<label for="${id}">${esc(it.label)}</label>` : "";
  const hint = it.hint ? `<p class="hint" id="${id}-h">${esc(it.hint)}</p>` : "";
  const desc = it.hint ? ` aria-describedby="${id}-h"` : "";
  switch(it.t){
    case "row": return `<div class="grid2">${it.items.map(fieldHTML).join("")}</div>`;
    case "text": case "date":
      return `<div class="field">${lab}${hint}<input type="${it.t}" id="${id}" data-k="${it.k}" value="${esc(F(it.k))}"${desc}></div>`;
    case "textarea":
      return `<div class="field">${lab}${hint}<textarea id="${id}" data-k="${it.k}"${desc} placeholder="${esc(it.ph||"")}">${esc(F(it.k))}</textarea></div>`;
    case "select":
      return `<div class="field">${lab}${hint}<select id="${id}" data-k="${it.k}"${desc}>${it.opts.map(o=>`<option value="${esc(o)}" ${F(it.k)===o?"selected":""}>${o?esc(o):"Choose…"}</option>`).join("")}</select></div>`;
    case "chips":
      return `<div class="field" role="group" aria-labelledby="${id}-l"><span class="lbl" id="${id}-l">${esc(it.label)}</span>${hint}<div class="chips">${it.opts.map(o=>`<button type="button" class="chip" data-chip="${it.k}" data-val="${esc(o)}" aria-pressed="${arr(it.k).includes(o)}">${esc(o)}</button>`).join("")}</div></div>`;
    case "checks": {
      const one = (key,label,ref) => `<label class="ck ${cur.checks[key]?"on":""}"><input type="checkbox" id="c-${key}" data-c="${key}" ${cur.checks[key]?"checked":""}><span>${esc(label)}${ref?`<span class="ref">${ref}</span>`:""}</span></label>`;
      if (it.groups) return `<div class="checks">${it.groups.map((g,gi)=>`<h4>${esc(g[0])}</h4>${g[1].map((x,i)=>one(`${it.k}.${gi}.${i}`,x[0],x[1])).join("")}`).join("")}</div>`;
      return `<div class="checks">${it.items.map((x,i)=>one(`${it.k}.${i}`,x[0],x[1])).join("")}</div>`;
    }
    case "custom": return `<div data-custom="${it.render}">${CUSTOM[it.render]()}</div>`;
  }
  return "";
}
const panelHTML = b => `<section class="panel"><h3>${esc(b.panel)}</h3>${b.sub?`<p class="sub">${esc(b.sub)}</p>`:""}${b.items.map(fieldHTML).join("")}</section>`;

/* ---------- Custom blocks ---------- */
const CUSTOM = {
  causeReadout(){
    const c = arr("causes");
    if (!c.length) return `<div class="readout">Choose the causes above to see whether learning is likely to close the gap.</div>`;
    const train = c.filter(x=>x==="Knowledge"||x==="Skill / practice").length;
    const other = c.length - train;
    if (train && !other) return `<div class="readout good"><b>Learning is likely the right fix.</b> The causes are knowledge and skill. Focus the design on realistic practice.</div>`;
    if (train && other) return `<div class="readout warn"><b>Learning is part of the answer.</b> Some causes are outside training (${esc(c.filter(x=>x!=="Knowledge"&&x!=="Skill / practice").join(", ").toLowerCase())}). Agree owners for those fixes, or the training won't stick.</div>`;
    return `<div class="readout warn"><b>Training probably won't fix this on its own.</b> None of the causes are knowledge or skill. Talk to the sponsor about process, tools, workload or communication fixes first.</div>`;
  }
};

}
function briefSections(){

   ["Design",[["Format",g("modality")],["Interactions",g("interactions")],["Seat time",g("seat")],["Tone",g("tone")],["Opening hook",g("hook")],["Structure",g("chunking")]]],
   ["Storyboard",null,"screens"],
   ["Feedback",[["Timing",g("fbtiming")],["Wrong answers",g("fbattempts")],["Types",g("fbtypes")],["Correct template",g("fbcorrect")],["Incorrect template",g("fbincorrect")]]],
   ["Accessibility",[["WCAG 2.2 AA checks",`${ck("wc")} of ${totOf("wc")} done`],["Inclusive design checks",`${ck("inc")} of ${totOf("inc")} done`],["Notes",g("a11ynotes")]]],

function fmtDate(s){ if(!s) return ""; const d=new Date(s+"T12:00:00"); return isNaN(d)?s:d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); }

    else if (special==="screens") md += cur.screens.length ? cur.screens.map((s,i)=>`${i+1}. **${s.title||"Untitled"}**${s.interaction?" · "+s.interaction:""}${s.content?" — "+s.content.replace(/\n/g," "):""}`).join("\n")+"\n" : "_Not yet captured_\n";

/* ---------- Persistence ---------- */
const LS = "storyLDT.projects.v1";
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS)||"[]"); } catch(e){ return []; } }
function lsWrite(){ try { localStorage.setItem(LS, JSON.stringify(projects)); return true; } catch(e){ return false; } }
function setStatus(t,cls){ const s=$("#status"); s.textContent=t; s.className="status "+(cls||""); }
function touch(){
  if (!cur || cur.example) return;
  cur.updated = Date.now();
  dirty.add(cur.id);
  setStatus("Unsaved changes","warn");
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900);
}
async function flush(){
  if (saving){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,400); return; }
  const ids=[...dirty]; dirty.clear(); if (!ids.length) return;
  saving = true;
  try {
    if (mode==="db"){
      for (const id of ids){ const p=projects.find(x=>x.id===id); if (p) await db.collection("data/users/"+userId).doc(id).set(clone(p)); }
      setStatus("Saved to your account","ok");
    } else {
      const ok=lsWrite(); setStatus(ok ? "Saved in this browser only" : "Not saved: storage unavailable","warn");
    }
  } catch(e){
    ids.forEach(i=>dirty.add(i));
    setStatus(e && e.code==="quota_exceeded" ? "Storage full: delete an old project" : "Couldn't save. Retrying…","warn");
    if (!e || e.code!=="quota_exceeded" && e.code!=="invalid_argument"){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,3000); }
  } finally { saving=false; }
}
async function removeProject(id){
  projects = projects.filter(p=>p.id!==id);
  if (mode==="db"){ try { await db.collection("data/users/"+userId).doc(id).delete(); } catch(e){ toast("Couldn't delete. Try again."); } }
  else lsWrite();
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- Boot ---------- */
function boot(){
  projects = lsRead();
  mode = "local";
  const start = projects.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
  openProject(start || clone(EXAMPLE));
  setStatus("Connecting to your saved projects…");
  const c = window.claude;
  if (!c || !c.use){ setStatus(projects.length?"Saved in this browser only":"Projects save in this browser only","warn"); return; }
  c.use("downloads").then(d=>{ downloads=d; if (d) document.querySelectorAll("[data-dl]").forEach(b=>b.hidden=false); }).catch(()=>{});
  Promise.all([c.use("db"), c.use("user")]).then(async ([d,u]) => {
    const id = u && u.id ? await u.id() : null;
    if (!d || !id){ setStatus("Saved in this browser only","warn"); return; }
    db=d; userId=id;
    let first=true;
    const timer = setTimeout(()=>{ if(first) setStatus("Can't reach saved projects yet","warn"); }, 10000);
    db.collection("data/users/"+userId).onSnapshot(snap => {
      if (snap.metadata.fromCache && first) return;
      clearTimeout(timer);
      const remote = snap.docs.map(x=>x.data()).filter(p=>p && p.id);
      if (first){
        first=false; mode="db";
        // Move any browser-only projects into the account once
        const local = projects.filter(p=>!remote.some(r=>r.id===p.id));
        projects = remote.map(clone).concat(local);
        local.forEach(p=>dirty.add(p.id));
        if (local.length){ try{ localStorage.removeItem(LS); }catch(e){} flush(); }
        const keep = cur && !cur.example ? projects.find(p=>p.id===cur.id) : null;
        openProject(keep || projects.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))[0] || clone(EXAMPLE));
        setStatus(projects.length?"Saved to your account":"Projects save to your account","ok");
        return;
      }
      // Later deliveries: pick up edits made in another tab/device
      let changed=false;
      remote.forEach(r=>{ const i=projects.findIndex(p=>p.id===r.id);
        if (i<0){ projects.push(clone(r)); changed=true; }
        else if ((r.updated||0) > (projects[i].updated||0) && !dirty.has(r.id)){ projects[i]=clone(r); changed=true; if (cur && cur.id===r.id){ cur=projects[i]; if(!main.contains(document.activeElement)) render(); } } });
      if (changed) renderProjects();
    }, err => { clearTimeout(timer); mode="local"; setStatus("Saved in this browser only","warn"); });
  }).catch(()=>setStatus("Saved in this browser only","warn"));
}
boot();
})();
</script>
